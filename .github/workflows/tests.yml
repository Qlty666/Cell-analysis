name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # A failed locked installation must fail the job.
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt

      # Docking dependencies are required in the full test environment.
      - name: Install docking dependencies
        shell: bash
        run: python -m pip install -r requirements_dock.txt

      - name: Check dependency consistency
        run: python -m pip check

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'

      - name: Run tests
        shell: bash
        run: python -m pytest -q -p no:cacheprovider

      - name: Validate all R scripts
        shell: bash
        run: |
          Rscript -e 'for (f in list.files("src", pattern="[.]R$", recursive=TRUE, full.names=TRUE)) parse(f)'

  pseudobulk-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            bioc::DESeq2
            any::Matrix
      - name: Run biological replicate smoke test
        run: Rscript tests/smoke_celltype_pseudobulk.R
