<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/static/nav.js" defer></script>
<title>虚拟筛选流水线</title>
<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  margin: 0;
  color: #1f2933;
  background: url('/static/background.png') no-repeat center center fixed;
  background-size: cover;
}
.topnav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #0f172a;
  padding: 12px 28px;
  display: flex;
  gap: 18px;
  align-items: center;
  flex-wrap: wrap;
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.35);
}
.topnav a {
  color: #ffffff;
  text-decoration: none;
  font-size: 15px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.08);
}
.topnav a:hover, .topnav a.active { background: #1665c0; color: #fff; }
.topnav .nav-right { margin-left: auto; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px; }
h1 { font-size: 26px; margin: 0 0 6px; }
h2 { font-size: 17px; margin: 0 0 10px; }
.muted { color: #6b7280; font-size: 13px; }
.card {
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid #d7dde4;
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
}
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.grid.wide { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 13px; }
input, select {
  width: 100%;
  padding: 9px;
  border: 1px solid #cbd2d9;
  border-radius: 6px;
  box-sizing: border-box;
  font-size: 13px;
}
.inline3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.actions { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
button {
  padding: 10px 18px;
  border: 0;
  border-radius: 6px;
  background: #1665c0;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
}
button.secondary { background: #475569; }
button.env-action { background: #1665c0; color: #fff; }
button.env-action:disabled { background: #9aa5b1; color: #fff; cursor: not-allowed; }
button:disabled { background: #9aa5b1; cursor: not-allowed; }
.toggle { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-weight: 600; }
.toggle input { width: auto; }
pre {
  background: #0f172a;
  color: #dbeafe;
  padding: 14px;
  border-radius: 8px;
  height: 380px;
  overflow: auto;
  font-size: 12px;
  white-space: pre-wrap;
}
.error { color: #b91c1c; margin-top: 10px; }
.ok { color: #047857; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
th, td { border: 1px solid #e5e7eb; padding: 7px 8px; text-align: left; }
th { background: #eef2f7; position: sticky; top: 0; }
.tablebox { max-height: 420px; overflow: auto; border: 1px solid #e5e7eb; border-radius: 6px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-top: 10px; }
.gallery figure { margin: 0; }
.gallery img { width: 100%; border: 1px solid #e5e7eb; border-radius: 6px; background: #fff; }
.gallery figcaption { color: #52606d; font-size: 12px; margin-top: 5px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
.badge.ok { background: #dcfce7; color: #166534; }
.badge.bad { background: #fee2e2; color: #991b1b; }
a.file-link { color: #1665c0; text-decoration: none; margin-right: 12px; }
.job-toast {
  position: fixed;
  top: 76px;
  right: 24px;
  z-index: 999;
  max-width: 440px;
  background: #ffffff;
  border: 1px solid #d7dde4;
  border-left: 6px solid #1665c0;
  border-radius: 8px;
  box-shadow: 0 12px 32px rgba(15, 23, 42, 0.28);
  padding: 14px 16px;
}
.job-toast.ok { border-left-color: #047857; }
.job-toast.error { border-left-color: #b91c1c; }
.job-toast.paused { border-left-color: #b45309; }
.job-toast-title { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.job-toast-body {
  font-size: 13px;
  color: #334155;
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 190px;
  overflow: auto;
}
.job-toast-close {
  margin-top: 10px;
  padding: 6px 14px;
  border: 0;
  border-radius: 6px;
  background: #1665c0;
  color: #fff;
  cursor: pointer;
}
</style>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="topnav">
  <a href="/full">全自动流水线</a>
  <a href="/">表达分析</a>
  <a href="/datasets">数据集搜索</a>
  <a href="/dock" class="active">虚拟筛选</a>
  <a href="/molecular-docking">分子对接</a>
  <a href="/results">结果清单</a>
  <a href="/tasks" class="nav-right">任务进度</a>
</div>
<div class="wrap">
<div class="page-head">
  <div class="page-title">
    <h1>虚拟筛选流水线</h1>
    <p class="page-sub">AutoDock Vina 对接：受体准备、配体库准备、并行对接、命中排序与多样性筛选。</p>
  </div>
</div>

<nav class="quicknav" aria-label="本页功能">
  <a href="#dock-run">虚拟筛选</a>
  <a href="#dock-results">筛选结果</a>
  <a href="#dock-env">环境状态</a>
</nav>

<div class="card" id="dock-run">
  <form id="form">
    <div class="grid wide">
      <label>工作目录
        <input name="workdir" placeholder="请输入保存路径" required>
      </label>
      <label>受体文件（相对工作目录）
        <input name="receptor" placeholder="请输入受体文件路径">
      </label>
      <label>配体库文件（相对工作目录）
        <input name="ligand" placeholder="请输入配体文件路径">
      </label>
    </div>
    <div class="grid wide">
      <label>执行步骤
        <select name="stage">
          <option value="pipeline">完整流程（断点续跑）</option>
          <option value="prepare-receptor">仅准备受体</option>
          <option value="prepare-ligands">仅准备配体</option>
          <option value="dock">仅对接</option>
          <option value="analyze">仅分析</option>
          <option value="evidence">证据收集（UniProt/PDB/ChEMBL/BindingDB/STRING/Open Targets 等）</option>
          <option value="ml-train">训练 ML/DL 重打分模型</option>
          <option value="ml-predict">ML/DL 重打分</option>
          <option value="export-md">导出 MD 交接模板</option>
          <option value="export-external">导出外部对接模板</option>
          <option value="redock">Top 命中精细重对接</option>
          <option value="report">生成 HTML 报告</option>
        </select>
      </label>
      <label>ML 模型（ml-train 使用）
        <select name="model">
          <option value="">默认</option>
          <option value="rf">rf - Random Forest</option>
          <option value="gbm">gbm - GBM</option>
          <option value="mlp">mlp - MLP</option>
          <option value="lasso_svm">lasso_svm - LASSO+SVM-RFE</option>
          <option value="torch">torch - PyTorch MLP</option>
        </select>
      </label>
      <label>训练 CSV（相对工作目录）
        <input name="training_csv" placeholder="data/ml/training.csv">
      </label>
      <label>标签列
        <input name="label_column" placeholder="active">
      </label>
      <div>
        <label>对接盒中心 (X Y Z)</label>
        <div class="inline3">
          <input name="center_x" type="number" step="0.1" value="0">
          <input name="center_y" type="number" step="0.1" value="0">
          <input name="center_z" type="number" step="0.1" value="0">
        </div>
      </div>
      <div>
        <label>对接盒尺寸 (X Y Z)</label>
        <div class="inline3">
          <input name="size_x" type="number" step="0.5" value="22.5">
          <input name="size_y" type="number" step="0.5" value="22.5">
          <input name="size_z" type="number" step="0.5" value="22.5">
        </div>
      </div>
      <div style="align-self:end;">
        <button class="env-action" type="button" onclick="detectBox()">自动检测对接盒</button>
      </div>
    </div>
    <div class="grid">
      <label>exhaustiveness
        <input name="exhaustiveness" type="number" min="1" value="8">
      </label>
      <label>num_modes
        <input name="num_modes" type="number" min="1" value="9">
      </label>
      <label>energy_range
        <input name="energy_range" type="number" step="0.5" value="3.0">
      </label>
      <label>cpu / workers
        <input name="max_workers" type="number" min="1" value="4">
      </label>
      <label>命中阈值 (kcal/mol)
        <input name="cutoff" type="number" step="0.1" value="-7.0">
      </label>
      <label>中结合阈值 (kcal/mol)
        <input name="moderate_cutoff" type="number" step="0.1" value="-5.0">
      </label>
      <label>Top N
        <input name="top_n" type="number" min="1" value="100">
      </label>
    </div>
    <label class="toggle"><input type="checkbox" name="force" value="1"> 强制从第一阶段重跑</label>
    <div class="actions">
      <button id="startBtn" type="button" data-primary onclick="startRun()">开始任务</button>
    </div>
  </form>
  <div id="message"></div>
  <div id="envBox"></div>
</div>



<div class="card">
  <h2>实时进度</h2>
  <div class="actions" style="margin-top:0;">
    <button id="pauseBtn" class="secondary" type="button" onclick="pauseDockJob()" disabled>暂停任务</button>
    <button id="resumeBtn" class="secondary" type="button" onclick="resumeDockJob()" disabled>继续任务</button>
  </div>
  <pre id="log">等待开始...</pre>
</div>

<div class="card" id="dock-results">
  <h2>筛选结果</h2>
  <div id="summaryRow"></div>
  <div id="fileLinks"></div>
  <div class="tablebox"><table id="resultTable"></table></div>
  <div id="gallery" class="gallery"></div>
</div>

<div class="card">
  <h2>分析历史</h2>
  <div id="dockHistory">正在加载历史记录...</div>
</div>

<div class="card" id="dock-env">
  <h2>环境状态与自动补全</h2>
  <label for="dockInstallPath">安装地址</label>
  <input id="dockInstallPath" name="install_path" placeholder="请输入环境安装地址">
  <div class="actions" style="margin-top:0;">
    <button class="env-action" type="button" onclick="checkEnv(this)">检查虚拟筛选环境</button>
    <button class="env-action" type="button" onclick="installEnv(this)">补全虚拟筛选环境</button>
  </div>
  <pre id="dockEnvOutput">点击“检查环境”查看当前依赖状态。</pre>
</div>

<div class="card">
  <h2>软件环境</h2>
  <div id="dockEnv">正在获取环境信息...</div>
</div>
</div>

<script src="/static/dock_app.js"></script>
<script>initDockPage();</script>
<div id="jobToast" class="job-toast" hidden>
  <div class="job-toast-title" id="jobToastTitle"></div>
  <div class="job-toast-body" id="jobToastBody"></div>
  <button type="button" class="job-toast-close" onclick="closeJobToast()">知道了</button>
</div>
</body>
</html>
