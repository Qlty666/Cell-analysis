<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/app.css">
<title>虚拟筛选流水线</title>
<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  margin: 0;
  color: #1f2933;
  background: url('/static/background.png') no-repeat center center fixed;
  background-size: cover;
}
.topnav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #0f172a;
  padding: 12px 28px;
  display: flex;
  gap: 18px;
  align-items: center;
  flex-wrap: wrap;
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.35);
}
.topnav a {
  color: #ffffff;
  text-decoration: none;
  font-size: 15px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.08);
}
.topnav a:hover, .topnav a.active { background: #1665c0; color: #fff; }
.topnav .nav-right { margin-left: auto; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px; }
h1 { font-size: 26px; margin: 0 0 6px; }
h2 { font-size: 17px; margin: 0 0 10px; }
.muted { color: #6b7280; font-size: 13px; }
.card {
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid #d7dde4;
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
}
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.grid.wide { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 13px; }
input, select {
  width: 100%;
  padding: 9px;
  border: 1px solid #cbd2d9;
  border-radius: 6px;
  box-sizing: border-box;
  font-size: 13px;
}
.inline3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.actions { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
button {
  padding: 10px 18px;
  border: 0;
  border-radius: 6px;
  background: #1665c0;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
}
button.secondary { background: #475569; }
button.env-action { background: #1665c0; color: #fff; }
button.env-action:disabled { background: #9aa5b1; color: #fff; cursor: not-allowed; }
button:disabled { background: #9aa5b1; cursor: not-allowed; }
.toggle { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-weight: 600; }
.toggle input { width: auto; }
pre {
  background: #0f172a;
  color: #dbeafe;
  padding: 14px;
  border-radius: 8px;
  height: 380px;
  overflow: auto;
  font-size: 12px;
  white-space: pre-wrap;
}
.error { color: #b91c1c; margin-top: 10px; }
.ok { color: #047857; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
th, td { border: 1px solid #e5e7eb; padding: 7px 8px; text-align: left; }
th { background: #eef2f7; position: sticky; top: 0; }
.tablebox { max-height: 420px; overflow: auto; border: 1px solid #e5e7eb; border-radius: 6px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-top: 10px; }
.gallery figure { margin: 0; }
.gallery img { width: 100%; border: 1px solid #e5e7eb; border-radius: 6px; background: #fff; }
.gallery figcaption { color: #52606d; font-size: 12px; margin-top: 5px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
.badge.ok { background: #dcfce7; color: #166534; }
.badge.bad { background: #fee2e2; color: #991b1b; }
a.file-link { color: #1665c0; text-decoration: none; margin-right: 12px; }
.job-toast {
  position: fixed;
  top: 76px;
  right: 24px;
  z-index: 999;
  max-width: 440px;
  background: #ffffff;
  border: 1px solid #d7dde4;
  border-left: 6px solid #1665c0;
  border-radius: 8px;
  box-shadow: 0 12px 32px rgba(15, 23, 42, 0.28);
  padding: 14px 16px;
}
.job-toast.ok { border-left-color: #047857; }
.job-toast.error { border-left-color: #b91c1c; }
.job-toast.paused { border-left-color: #b45309; }
.job-toast-title { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.job-toast-body {
  font-size: 13px;
  color: #334155;
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 190px;
  overflow: auto;
}
.job-toast-close {
  margin-top: 10px;
  padding: 6px 14px;
  border: 0;
  border-radius: 6px;
  background: #1665c0;
  color: #fff;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="topnav">
  <a href="/full">全自动流水线</a>
  <a href="/">单细胞分析</a>
  <a href="/datasets">数据集搜索</a>
  <a href="/dock" class="active">虚拟筛选</a>
  <a href="/results">结果清单</a>
  <a href="/tasks" class="nav-right">任务进度</a>
</div>
<div class="wrap">
<div class="page-head">
  <div class="page-title">
    <h1>虚拟筛选流水线</h1>
    <p class="page-sub">AutoDock Vina 对接：受体准备、配体库准备、并行对接、命中排序与多样性筛选。</p>
  </div>
  <div class="page-actions">
    <a class="link-button" href="/full">全自动流水线</a>
    <a class="link-button" href="/results">结果清单</a>
  </div>
</div>

<div class="card">
  <form id="form">
    <div class="grid wide">
      <label>工作目录
        <input name="workdir" placeholder="请输入保存路径" required>
      </label>
      <label>受体文件（相对工作目录）
        <input name="receptor" placeholder="请输入受体文件路径">
      </label>
      <label>配体库文件（相对工作目录）
        <input name="ligand" placeholder="请输入配体文件路径">
      </label>
    </div>
    <div class="grid wide">
      <label>执行步骤
        <select name="stage">
          <option value="pipeline">完整流程（断点续跑）</option>
          <option value="prepare-receptor">仅准备受体</option>
          <option value="prepare-ligands">仅准备配体</option>
          <option value="dock">仅对接</option>
          <option value="analyze">仅分析</option>
          <option value="evidence">证据收集（UniProt/PDB/ChEMBL/BindingDB/STRING/Open Targets 等）</option>
          <option value="ml-train">训练 ML/DL 重打分模型</option>
          <option value="ml-predict">ML/DL 重打分</option>
          <option value="export-md">导出 MD 交接模板</option>
          <option value="export-external">导出外部对接模板</option>
          <option value="redock">Top 命中精细重对接</option>
          <option value="report">生成 HTML 报告</option>
        </select>
      </label>
      <label>ML 模型（ml-train 使用）
        <select name="model">
          <option value="">默认</option>
          <option value="rf">rf - Random Forest</option>
          <option value="gbm">gbm - GBM</option>
          <option value="mlp">mlp - MLP</option>
          <option value="lasso_svm">lasso_svm - LASSO+SVM-RFE</option>
          <option value="torch">torch - PyTorch MLP</option>
        </select>
      </label>
      <label>训练 CSV（相对工作目录）
        <input name="training_csv" placeholder="data/ml/training.csv">
      </label>
      <label>标签列
        <input name="label_column" placeholder="active">
      </label>
      <div>
        <label>对接盒中心 (X Y Z)</label>
        <div class="inline3">
          <input name="center_x" type="number" step="0.1" value="0">
          <input name="center_y" type="number" step="0.1" value="0">
          <input name="center_z" type="number" step="0.1" value="0">
        </div>
      </div>
      <div>
        <label>对接盒尺寸 (X Y Z)</label>
        <div class="inline3">
          <input name="size_x" type="number" step="0.5" value="22.5">
          <input name="size_y" type="number" step="0.5" value="22.5">
          <input name="size_z" type="number" step="0.5" value="22.5">
        </div>
      </div>
      <div style="align-self:end;">
        <button class="env-action" type="button" onclick="detectBox()">自动检测对接盒</button>
      </div>
    </div>
    <div class="grid">
      <label>exhaustiveness
        <input name="exhaustiveness" type="number" min="1" value="8">
      </label>
      <label>num_modes
        <input name="num_modes" type="number" min="1" value="9">
      </label>
      <label>energy_range
        <input name="energy_range" type="number" step="0.5" value="3.0">
      </label>
      <label>cpu / workers
        <input name="max_workers" type="number" min="1" value="4">
      </label>
      <label>命中阈值 (kcal/mol)
        <input name="cutoff" type="number" step="0.1" value="-7.0">
      </label>
      <label>Top N
        <input name="top_n" type="number" min="1" value="100">
      </label>
    </div>
    <label class="toggle"><input type="checkbox" name="force" value="1"> 强制从第一阶段重跑</label>
    <div class="actions">
      <button id="startBtn" type="button" onclick="startRun()">开始任务</button>
    </div>
  </form>
  <div id="message"></div>
  <div id="envBox"></div>
</div>

<div class="card">
  <h2>虚拟敲除优先级分析</h2>
  <form id="koForm">
    <div class="grid wide">
      <label>工作目录
        <input name="ko_workdir" placeholder="请输工作目录，默认 dock">
      </label>
      <label>表达矩阵 CSV（相对工作目录）
        <input name="ko_expression" placeholder="data/knockout/expression.csv" required>
      </label>
      <label>样本元数据 CSV（可选）
        <input name="ko_metadata" placeholder="data/knockout/metadata.csv">
      </label>
      <label>DepMap 依赖 CSV（可选）
        <input name="ko_depmap" placeholder="data/knockout/depmap_gene_effect.csv">
      </label>
      <label>PPI 网络边表 CSV/TSV（可选）
        <input name="ko_ppi" placeholder="data/network/string_edges.tsv">
      </label>
      <label>肿瘤/病例标签（可选）
        <input name="ko_case" placeholder="Tumor">
      </label>
      <label>正常标签（可选）
        <input name="ko_normal" placeholder="Normal">
      </label>
      <label>Top N
        <input name="ko_top_n" type="number" min="1" value="50">
      </label>
    </div>
    <div class="actions">
      <button type="button" onclick="runKnockout(this)">运行虚拟敲除</button>
      <button type="button" class="secondary" onclick="exportValidation(this)">导出湿实验验证方案</button>
    </div>
  </form>
  <div id="koMessage"></div>
  <div id="koSummary"></div>
  <div id="koFiles"></div>
  <div id="koValidation"></div>
  <div class="tablebox"><table id="koTable"></table></div>
  <div id="koGallery" class="gallery"></div>
</div>

<div class="card">
  <h2>网络毒理学分析</h2>
  <form id="netForm">
    <div class="grid wide">
      <label>工作目录
        <input name="net_workdir" placeholder="默认 dock">
      </label>
      <label>化合物名称
        <input name="net_compound_name" placeholder="Bisphenol A">
      </label>
      <label>疾病名称
        <input name="net_disease_name" placeholder="Hepatocellular Carcinoma">
      </label>
      <label>化合物靶点 CSV（相对工作目录）
        <input name="net_compound_targets" placeholder="data/network/compound_targets.csv" required>
      </label>
      <label>疾病基因 CSV（相对工作目录）
        <input name="net_disease_genes" placeholder="data/network/disease_genes.csv" required>
      </label>
      <label>PPI 边表（可选）
        <input name="net_ppi" placeholder="data/network/string_edges.tsv">
      </label>
    </div>
    <div class="actions">
      <button type="button" onclick="runNetwork(this)">运行网络毒理学</button>
    </div>
  </form>
  <div id="netMessage"></div>
  <div id="netSummary"></div>
  <div id="netFiles"></div>
  <div class="tablebox"><table id="netTable"></table></div>
  <div id="netGallery" class="gallery"></div>
</div>

<div class="card">
  <h2>FAERS 不相称性信号检测</h2>
  <form id="faersForm">
    <div class="grid wide">
      <label>工作目录
        <input name="faers_workdir" placeholder="默认 dock">
      </label>
      <label>事件表 CSV（相对工作目录）
        <input name="faers_input" placeholder="data/faers/events.csv" required>
      </label>
      <label>药物列
        <input name="faers_drug_column" value="drug">
      </label>
      <label>事件列
        <input name="faers_event_column" value="event">
      </label>
      <label>计数列（可选）
        <input name="faers_count_column" value="count">
      </label>
      <label>最小计数
        <input name="faers_min_count" type="number" min="1" value="3">
      </label>
    </div>
    <div class="actions">
      <button type="button" onclick="runFaers(this)">运行 FAERS 信号检测</button>
    </div>
  </form>
  <div id="faersMessage"></div>
  <div id="faersSummary"></div>
  <div id="faersFiles"></div>
  <div class="tablebox"><table id="faersTable"></table></div>
</div>

<div class="card">
  <h2>随机真实 GSE 验证报告</h2>
  <div class="actions" style="margin-top:0;">
    <button type="button" onclick="loadValidationReport()">查看验证报告</button>
    <button type="button" class="secondary" onclick="runValidationJob(this)">重新运行随机真实 GSE 验证</button>
  </div>
  <pre id="validationReport">点击“查看验证报告”加载结果。</pre>
</div>

<div class="card">
  <h2>实时进度</h2>
  <div class="actions" style="margin-top:0;">
    <button id="pauseBtn" class="secondary" type="button" onclick="pauseDockJob()" disabled>暂停任务</button>
    <button id="resumeBtn" class="secondary" type="button" onclick="resumeDockJob()" disabled>继续任务</button>
  </div>
  <pre id="log">等待开始...</pre>
</div>

<div class="card">
  <h2>筛选结果</h2>
  <div id="summaryRow"></div>
  <div id="fileLinks"></div>
  <div class="tablebox"><table id="resultTable"></table></div>
  <div id="gallery" class="gallery"></div>
</div>

<div class="card">
  <h2>分析历史</h2>
  <div id="dockHistory">正在加载历史记录...</div>
</div>

<div class="card">
  <h2>环境状态与自动补全</h2>
  <label for="dockInstallPath">安装地址</label>
  <input id="dockInstallPath" name="install_path" placeholder="请输入环境安装地址">
  <div class="actions" style="margin-top:0;">
    <button class="env-action" type="button" onclick="checkEnv(this)">检查虚拟筛选环境</button>
    <button class="env-action" type="button" onclick="installEnv(this)">补全虚拟筛选环境</button>
  </div>
  <pre id="dockEnvOutput">点击“检查环境”查看当前依赖状态。</pre>
</div>

<div class="card">
  <h2>软件环境</h2>
  <div id="dockEnv">正在获取环境信息...</div>
</div>
</div>

<script>
function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
let currentJob = null;
let pollTimer = null;
let jobAlerted = false;
const DOCK_JOB_KEY = 'liver_ui_dock_job';

function saveJobRecord() {
  try { sessionStorage.setItem(DOCK_JOB_KEY, currentJob); } catch (e) {}
}

function clearJobRecord() {
  try { sessionStorage.removeItem(DOCK_JOB_KEY); } catch (e) {}
}

function restoreJobRecord() {
  let saved = null;
  let target = null;
  try { saved = sessionStorage.getItem(DOCK_JOB_KEY); } catch (e) {}
  try { target = new URLSearchParams(window.location.search).get('job'); } catch (e) {}
  const job = target || saved;
  if (!job) return;
  currentJob = job;
  saveJobRecord();
  if (target) {
    try {
      const url = new URL(window.location.href);
      url.searchParams.delete('job');
      window.history.replaceState(null, '', url.toString());
    } catch (e) {}
  }
  msg('已恢复正在运行的虚拟筛选任务，日志继续刷新。', 'ok');
  document.getElementById('pauseBtn').disabled = false;
  document.getElementById('resumeBtn').disabled = true;
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(poll, 1000);
}

function showJobToast(kind, title, body) {
  const toast = document.getElementById('jobToast');
  if (!toast) return;
  toast.className = 'job-toast ' + (kind || 'info');
  document.getElementById('jobToastTitle').textContent = title;
  document.getElementById('jobToastBody').textContent = body || '';
  toast.hidden = false;
  jobAlerted = true;
}

function closeJobToast() {
  const toast = document.getElementById('jobToast');
  if (toast) toast.hidden = true;
}

function msg(text, cls) {
  const el = document.getElementById('message');
  el.className = cls || '';
  el.textContent = text;
}

function formValue(name) {
  const form = document.getElementById('form');
  if (!form) return '';
  const fd = new FormData(form);
  return fd.get(name) || '';
}

async function checkEnv(btn) {
  const box = document.getElementById('dockEnvOutput');
  btn.disabled = true;
  box.textContent = '正在检查环境...';
  try {
    await loadDockEnv();
    box.textContent = '环境检查完成。';
  } finally {
    btn.disabled = false;
  }
}

async function detectBox() {
  const workdir = formValue('workdir');
  const receptor = formValue('receptor');
  if (!workdir || !receptor) {
    msg('请先填写工作目录和受体文件路径', 'error');
    return;
  }
  const form = new URLSearchParams({workdir: workdir, receptor: receptor});
  try {
    const resp = await fetch('/dock/detect-box', {method: 'POST', body: form});
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || '检测失败');
    const setVal = (id, value) => {
      const el = document.getElementById(id);
      if (el) el.value = value;
    };
    setVal('center_x', data.center[0]);
    setVal('center_y', data.center[1]);
    setVal('center_z', data.center[2]);
    setVal('size_x', data.size[0]);
    setVal('size_y', data.size[1]);
    setVal('size_z', data.size[2]);
    msg('对接盒已自动检测并写入配置。', 'ok');
  } catch (e) {
    msg(String(e.message || e), 'error');
  }
}

async function startRun() {
  const form = document.getElementById('form');
  const data = new URLSearchParams(new FormData(form));
    const btn = document.getElementById('startBtn');
    btn.disabled = true;
    jobAlerted = false;
    closeJobToast();
    msg('正在启动...');
  try {
    const resp = await fetch('/dock/start', {method: 'POST', body: data});
    const result = await resp.json();
    if (!resp.ok) throw new Error(result.error || '启动失败');
    currentJob = result.job;
    saveJobRecord();
    document.getElementById('log').textContent = '';
    document.getElementById('resultTable').innerHTML = '';
    document.getElementById('gallery').innerHTML = '';
    document.getElementById('summaryRow').textContent = '';
    document.getElementById('fileLinks').textContent = '';
    msg('任务已启动，日志实时刷新。', 'ok');
    document.getElementById('pauseBtn').disabled = false;
    document.getElementById('resumeBtn').disabled = true;
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(poll, 1000);
  } catch (e) {
    msg(String(e.message || e), 'error');
  } finally {
    btn.disabled = false;
  }
}

async function poll() {
  if (!currentJob) return;
  try {
    const logResp = await fetch('/dock/log?job=' + currentJob);
    const text = await logResp.text();
    const box = document.getElementById('log');
    box.textContent = text;
    box.scrollTop = box.scrollHeight;
    const statusResp = await fetch('/dock/status?job=' + currentJob);
    const status = await statusResp.json();
    const pauseBtn = document.getElementById('pauseBtn');
    const resumeBtn = document.getElementById('resumeBtn');
    if (status.queued) {
      pauseBtn.disabled = true;
      resumeBtn.disabled = true;
      msg('任务已进入队列，等待前面的任务完成...', 'ok');
      return;
    }
    if (status.running) {
      pauseBtn.disabled = false;
      resumeBtn.disabled = true;
    } else if (status.paused) {
      pauseBtn.disabled = true;
      resumeBtn.disabled = false;
    } else {
      pauseBtn.disabled = true;
      resumeBtn.disabled = true;
    }
    if (!status.running) {
      clearInterval(pollTimer);
      const m = document.getElementById('message');
      if (status.paused) {
        m.className = 'ok';
        m.textContent = '任务已暂停，可点击继续任务。';
        if (!jobAlerted) {
          showJobToast('paused', '任务已暂停', '当前阶段：' + (status.stage || '未知'));
        }
      } else {
        m.className = status.ok ? 'ok' : 'error';
        if (status.ok) {
          m.textContent = '任务已完成';
          if (!jobAlerted) showJobToast('ok', '任务已完成', '虚拟筛选任务已全部完成。');
        } else {
          m.textContent = '任务失败，请查看日志';
          if (!jobAlerted) {
            showJobToast('error', '任务中断', '运行到阶段：' + (status.stage || '未知') + '\n原因：' + (status.error || '请查看日志'));
          }
        }
      }
      if (status.ok) await loadResults(currentJob);
      if (!status.paused) {
        currentJob = null;
        clearJobRecord();
      }
    }
  } catch (e) {
    // keep polling on transient errors
  }
}

async function pauseDockJob() {
  if (!currentJob) return;
  const form = new URLSearchParams({job: currentJob});
  try {
    const resp = await fetch('/dock/pause', {method: 'POST', body: form});
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || '暂停失败');
    msg('暂停请求已发送。', 'ok');
  } catch (e) {
    msg(String(e.message || e), 'error');
  }
}

async function resumeDockJob() {
  if (!currentJob) return;
  const form = new URLSearchParams({job: currentJob});
  try {
    const resp = await fetch('/dock/resume', {method: 'POST', body: form});
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || '恢复失败');
    msg('任务已恢复。', 'ok');
    jobAlerted = false;
    closeJobToast();
    document.getElementById('pauseBtn').disabled = false;
    document.getElementById('resumeBtn').disabled = true;
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(poll, 1000);
  } catch (e) {
    msg(String(e.message || e), 'error');
  }
}

async function loadResults(job) {
  try {
    const resp = await fetch('/dock/results?job=' + job);
    const data = await resp.json();
    const summary = data.summary || {};
    const summaryRow = document.getElementById('summaryRow');
    summaryRow.innerHTML = '<p class="muted">成功对接 ' + esc(summary.total_docked || 0) +
      ' 个配体，命中 ' + esc(summary.hits || 0) +
      ' 个，最佳亲和力 ' + esc(summary.best_affinity === null || summary.best_affinity === undefined ? '-' : summary.best_affinity) +
      ' kcal/mol。输出目录：' + esc(data.output_dir) + '</p>';

    const links = document.getElementById('fileLinks');
    links.innerHTML = (data.files || []).map(name =>
      '<a class="file-link" href="/dock/file?job=' + job + '&name=' + encodeURIComponent(name) + '" download>' + esc(name) + '</a>'
    ).join('');

    const table = document.getElementById('resultTable');
    if (data.rows && data.rows.length) {
      table.innerHTML = '<thead><tr><th>排名</th><th>ID</th><th>亲和力</th><th>模式</th><th>SMILES</th></tr></thead><tbody>' +
        data.rows.map(r =>
          '<tr><td>' + esc(r.rank || '') + '</td><td>' + esc(r.id) + '</td><td>' +
          esc(r.affinity) + '</td><td>' + esc(r.mode || '') + '</td><td style="max-width:280px;word-break:break-all;">' +
          esc(r.smiles || '') + '</td></tr>'
        ).join('') + '</tbody>';
    } else {
      table.innerHTML = '<tbody><tr><td>暂无结果</td></tr></tbody>';
    }

    const gallery = document.getElementById('gallery');
    gallery.innerHTML = (data.figures || []).map(name =>
      '<figure><img src="/dock/file?job=' + job + '&name=' + encodeURIComponent(name) + '"><figcaption>' + esc(name) + '</figcaption></figure>'
    ).join('');
  } catch (e) {
    document.getElementById('summaryRow').innerHTML = '<div class="error">结果加载失败：' + esc(e.message || e) + '</div>';
  }
}

async function loadDockHistory() {
  const box = document.getElementById('dockHistory');
  try {
    const resp = await fetch('/dock/history');
    const items = await resp.json();
    if (!items.length) {
      box.textContent = '暂无分析历史。';
      return;
    }
    const rows = items.map(item =>
      '<tr><td>' + esc(item.stage || '') + '</td><td>' + esc(item.status) + '</td><td>' +
      new Date(item.finished * 1000).toLocaleString() + '</td><td>' +
      esc(item.output) + '</td></tr>'
    ).join('');
    box.innerHTML = '<table><thead><tr><th>阶段</th><th>状态</th><th>完成时间</th><th>输出路径</th></tr></thead><tbody>' + rows + '</tbody></table>';
  } catch (e) {
    box.textContent = '历史记录加载失败：' + String(e.message || e);
  }
}

async function loadDockEnv() {
  const box = document.getElementById('dockEnv');
  try {
    const resp = await fetch('/dock/check-env', {method: 'POST'});
    const data = await resp.json();
    if (!data.checks || !data.checks.length) {
      box.textContent = '无法获取环境信息。';
      return;
    }
    const badge = c => c.ok ? '<span class="badge ok">OK</span>' : '<span class="badge bad">FAIL</span>';
    const software = data.checks.filter(c => c.kind === 'software');
    const packages = data.checks.filter(c => c.kind !== 'software');
    const softwareRows = software.map(c =>
      '<tr><td>' + esc(c.name) + '</td><td>' + esc(c.version) + '</td><td>' + badge(c) +
      '</td><td><a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.url) + '</a></td></tr>'
    ).join('');
    const packageRows = packages.map(c =>
      '<tr><td>' + esc(c.name) + '</td><td>' + esc(c.version) + '</td><td>' + badge(c) +
      '</td><td><code>' + esc(c.install || '') + '</code></td></tr>'
    ).join('');
    let html = '<h3>软件</h3>';
    html += '<table><thead><tr><th>软件</th><th>版本/路径</th><th>状态</th><th>下载地址</th></tr></thead><tbody>' + softwareRows + '</tbody></table>';
    html += '<h3>Python 库 / 插件</h3>';
    html += '<table><thead><tr><th>插件</th><th>版本</th><th>状态</th><th>安装命令</th></tr></thead><tbody>' + packageRows + '</tbody></table>';
    box.innerHTML = html;
  } catch (e) {
    box.textContent = '环境信息加载失败：' + String(e.message || e);
  }
}

async function installEnv(btn) {
  const box = document.getElementById('dockEnvOutput');
  const target = document.getElementById('dockInstallPath').value.trim();
  btn.disabled = true;
  box.innerHTML = '<p class="muted">正在安装缺失依赖，请稍候...</p>';
  try {
    const form = new URLSearchParams({project: 'dock'});
    if (target) form.set('target', target);
    await fetch('/install', {method: 'POST', body: form});
    const timer = setInterval(async () => {
      try {
        const resp = await fetch('/install-status');
        const data = await resp.json();
        if (!data.running) {
          clearInterval(timer);
          const ok = data.ok;
          box.innerHTML = '<div class="' + (ok ? 'ok' : 'error') + '">' +
            (ok ? '环境补全完成。' : '环境补全失败，请查看日志。') +
            '</div>' + (data.log ? '<pre style="height:220px;">' + esc(data.log) + '</pre>' : '');
          await loadDockEnv();
          btn.disabled = false;
        } else {
          box.innerHTML = '<pre style="height:220px;">' + esc(data.log || '正在安装...') + '</pre>';
        }
      } catch (e) {
        clearInterval(timer);
        box.innerHTML = '<div class="error">状态读取失败：' + esc(e.message || e) + '</div>';
        btn.disabled = false;
      }
    }, 1000);
  } catch (e) {
    box.innerHTML = '<div class="error">环境补全启动失败：' + esc(e.message || e) + '</div>';
    btn.disabled = false;
  }
}

function koMsg(text, cls) {
  const el = document.getElementById('koMessage');
  el.className = cls || '';
  el.textContent = text;
}

async function runKnockout(btn) {
  const form = document.getElementById('koForm');
  const data = new URLSearchParams(new FormData(form));
  btn.disabled = true;
  koMsg('正在运行虚拟敲除...');
  try {
    const resp = await fetch('/dock/knockout', {method: 'POST', body: data});
    const result = await resp.json();
    if (!resp.ok) throw new Error(result.error || '虚拟敲除失败');
    renderKnockout(result);
    koMsg('虚拟敲除完成。', 'ok');
  } catch (e) {
    koMsg(String(e.message || e), 'error');
  } finally {
    btn.disabled = false;
  }
}

async function exportValidation(btn) {
  const form = document.getElementById('koForm');
  const data = new URLSearchParams(new FormData(form));
  if (!data.get('validation_top_n')) data.set('validation_top_n', '10');
  btn.disabled = true;
  const box = document.getElementById('koValidation');
  box.textContent = '正在导出湿实验验证方案...';
  try {
    const resp = await fetch('/dock/knockout/validate', {method: 'POST', body: data});
    const result = await resp.json();
    if (!resp.ok) throw new Error(result.error || '验证方案导出失败');
    const linkBase = '/dock/knockout/file?workdir=' +
      encodeURIComponent(result.workdir) + '&name=';
    box.innerHTML = '<p class="muted">验证方案已导出：' + esc(result.output_dir) + '</p>' +
      (result.files || []).map(name =>
        '<a class="file-link" href="' + linkBase + encodeURIComponent(name) +
        '" download>' + esc(name) + '</a>'
      ).join('');
  } catch (e) {
    box.innerHTML = '<p class="error">' + esc(e.message || e) + '</p>';
  } finally {
    btn.disabled = false;
  }
}

async function loadValidationReport() {
  const box = document.getElementById('validationReport');
  box.textContent = '正在加载验证报告...';
  try {
    const resp = await fetch('/dock/validation-report');
    const data = await resp.json();
    box.textContent = data.report || '暂无报告';
  } catch (e) {
    box.textContent = '加载失败：' + String(e.message || e);
  }
}

async function runValidationJob(btn) {
  const box = document.getElementById('validationReport');
  btn.disabled = true;
  box.textContent = '正在启动随机真实 GSE 验证（10 个数据集，耗时较长）...';
  try {
    const resp = await fetch('/dock/validation/run', {method: 'POST'});
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || '启动失败');
    const timer = setInterval(async () => {
      try {
        const sresp = await fetch('/dock/validation-status');
        const status = await sresp.json();
        if (!status.running) {
          clearInterval(timer);
          btn.disabled = false;
          box.textContent = (status.ok ? '验证完成。' : '验证运行失败。') +
            '\n' + (status.log || '');
          if (status.ok) await loadValidationReport();
        } else {
          box.textContent = '验证运行中...\n' + (status.log || '');
        }
      } catch (e) {
        clearInterval(timer);
        btn.disabled = false;
        box.textContent = '状态读取失败：' + String(e.message || e);
      }
    }, 2000);
  } catch (e) {
    btn.disabled = false;
    box.textContent = '启动失败：' + String(e.message || e);
  }
}

function renderKnockout(data) {
  const summary = data.summary || {};
  const summaryEl = document.getElementById('koSummary');
  const classes = summary.target_class_counts || {};
  const classText = Object.keys(classes).map(k =>
    k + ' ' + classes[k]
  ).join('；');
  summaryEl.innerHTML = '<p class="muted">评分基因 ' + esc(summary.genes_scored || 0) +
    ' 个，病例样本 ' + esc(summary.case_samples || 0) +
    '，正常样本 ' + esc(summary.normal_samples || 0) +
    '，DepMap 细胞系 ' + esc(summary.depmap_lines || 0) +
    '，多维评分 ' + (summary.multidimensional_scoring ? '是' : '否') +
    '。分类：' + esc(classText || '无') +
    '。输出目录：' + esc(data.output_dir) + '</p>';

  const linkBase = '/dock/knockout/file?workdir=' +
    encodeURIComponent(data.workdir) + '&name=';
  document.getElementById('koFiles').innerHTML = (data.files || []).map(name =>
    '<a class="file-link" href="' + linkBase + encodeURIComponent(name) +
    '" download>' + esc(name) + '</a>'
  ).join('');

  const headers = ['排名', '基因', '靶点评分', '分类', '敲除分', '逆转分', '通路分',
    '特异性分', '预后分', '成药性分', 'PPI hub', '安全标记', '优先级'];
  const keys = ['rank', 'gene', 'target_score', 'target_class', 'knockout_score',
    'reversal_score', 'pathway_score', 'specificity_score', 'prognosis_score',
    'druggability_score', 'ppi_hub_score', 'safety_concern', 'target_priority'];
  const scoreKeys = ['target_score', 'knockout_score', 'reversal_score',
    'pathway_score', 'specificity_score', 'prognosis_score', 'druggability_score',
    'ppi_hub_score', 'safety_concern'];
  const table = document.getElementById('koTable');
  if (data.rows && data.rows.length) {
    table.innerHTML = '<thead><tr>' + headers.map(h =>
      '<th>' + h + '</th>'
    ).join('') + '</tr></thead><tbody>' + data.rows.map(row => {
      return '<tr>' + keys.map(key => {
        let value = row[key];
        if (scoreKeys.indexOf(key) >= 0 && value !== '' &&
            value !== undefined && value !== null) {
          value = Number(value).toFixed(3);
        }
        if (value === '' || value === undefined || value === null) value = '-';
        return '<td>' + esc(value) + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody>';
  } else {
    table.innerHTML = '<tbody><tr><td>暂无结果</td></tr></tbody>';
  }

  document.getElementById('koGallery').innerHTML = (data.figures || []).map(name =>
    '<figure><img src="' + linkBase + encodeURIComponent(name) +
    '"><figcaption>' + esc(name) + '</figcaption></figure>'
  ).join('');
}

async function runFaers(btn) {
  const form = document.getElementById('faersForm');

function renderFaers(data) {

    '<p class="muted">药物-事件组合 ' + esc(summary.pairs || 0) +

    ' 个，最小计数 ' + esc(summary.min_count || 3) +
    '。输出目录：' + esc(data.output_dir) + '</p>';

  const linkBase = '/dock/faers/file?workdir=' +
    encodeURIComponent(data.workdir) + '&name=';
  document.getElementById('faersFiles').innerHTML = (data.files || []).map(name =>
    '<a class="file-link" href="' + linkBase + encodeURIComponent(name) +
    '" download>' + esc(name) + '</a>'
  ).join('');

  const headers = ['药物', '事件', '计数', 'ROR', 'ROR 下限', 'PRR',
    'IC', 'EBGM', '信号'];
  const keys = ['drug', 'event', 'a', 'ror', 'ror_lower', 'prr',
    'ic', 'ebgm', 'signal'];
  const table = document.getElementById('faersTable');
  if (data.rows && data.rows.length) {
    table.innerHTML = '<thead><tr>' + headers.map(h =>
      '<th>' + h + '</th>'
    ).join('') + '</tr></thead><tbody>' + data.rows.map(row => {
      return '<tr>' + keys.map(key => {

    }).join('') + '</tbody>';
  } else {
    table.innerHTML = '<tbody><tr><td>暂无信号结果</td></tr></tbody>';
  }

loadDockHistory();
loadDockEnv();
loadValidationReport();
restoreJobRecord();
</script>
